name: ci

# Roda em todo push e em todo PR. Um PR só pode ser mergeado com esta CI verde
# (CONTRIBUTING.md §4). É a rede que impede uma mudança de introduzir lookahead,
# segredo, sinal invertido ou lint quebrado sem ninguém ver.
on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Instalar dependências (lockfile reprodutível)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Porta de qualidade
        run: python scripts/quality.py
